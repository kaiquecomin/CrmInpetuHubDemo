spring.application.name=inpetu-connect
server.port=${PORT:8080}
# Banco PRINCIPAL (obrigatório)
app.db.main.url=${DB_URL:jdbc:mysql://localhost:3306/inpetu_connect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
app.db.main.user=${DB_USER:root}
app.db.main.password=${DB_PASSWORD:}
# Banco de TESTE (opcional: se DB_TEST_URL ficar vazia, o seletor do site é desativado)
app.db.test.url=${DB_TEST_URL:}
app.db.test.user=${DB_TEST_USER:${DB_USER:root}}
app.db.test.password=${DB_TEST_PASSWORD:${DB_PASSWORD:}}
app.db.test.seed-demo=${DB_TEST_SEED_DEMO:true}
spring.datasource.url=${app.db.main.url}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:import.sql
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jackson.time-zone=America/Sao_Paulo
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:inpetu@ufsc.br}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
