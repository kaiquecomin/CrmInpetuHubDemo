spring.application.name=inpetu-connect
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[01])\\.\\d{1,3}\\.\\d{1,3}|100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|::1}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inpetu_connect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-duration-seconds=${LOGIN_LOCK_DURATION_SECONDS:900}
app.security.trusted-proxies=${TRUSTED_PROXIES:}
app.bootstrap.admin.email=${APP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:import.sql
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jackson.time-zone=America/Sao_Paulo
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.features.mural=${MURAL_ENABLED:false}
